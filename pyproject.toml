[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hazzel"
version = "1.2.0"
description = "A small terminal coding agent — bring your own keys (Groq, OpenAI, Anthropic, Mistral)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "openai",
    "mistralai",
    "anthropic",
    "rich",
]
license = { text = "AGPL-3.0-or-later" }

[project.scripts]
hazzel = "hazzel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]