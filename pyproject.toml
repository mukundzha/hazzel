[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hazzel"
version = "0.1.0"
description = "A lightweight terminal coding agent powered by Groq."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "openai",
    "mistralai",
    "anthropic",
    "rich",
]
license = { text = "AGPL-3.0-or-later" }

[tool.setuptools.packages.find]
where = ["src"]