[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hazzel"
dynamic = ["version"]
description = "A small terminal coding agent — bring your own keys (Groq, OpenAI, Anthropic, Mistral)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE*"]
authors = [{ name = "Mukund Jha" }]
keywords = ["ai-agent", "coding-agent", "terminal", "cli", "llm", "developer-tools", "groq", "openai", "anthropic", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "groq>=1.7",
    "openai>=1.0",
    "mistralai>=1.0",
    "anthropic>=0.40",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/mukundzha/hazzel"
Repository = "https://github.com/mukundzha/hazzel"
Issues = "https://github.com/mukundzha/hazzel/issues"
Changelog = "https://github.com/mukundzha/hazzel/blob/main/CHANGELOG.md"

[project.scripts]
hazzel = "hazzel.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "build>=1",
    "twine>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "hazzel.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Historical lint contract: ruff's classic default set. Newer ruff releases
# enable far more rules by default (isort, bandit, flake8-blind-except, ...);
# adopting those is a separate cleanup, not drive-by churn on every PR.
select = ["E4", "E7", "E9", "F"]